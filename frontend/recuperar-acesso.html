<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar ingresso | Arraiá do CETEP</title>

  <style>
    :root {
      --amarelo: #ffd86b;
      --laranja: #ff9f43;
      --azul: #64c7ff;
      --rosa: #ff7eb6;
      --verde: #8ee59d;
      --roxo: #b497ff;
      --texto: #32213a;
      --branco: #ffffff;
      --sombra: 0 18px 45px rgba(80, 48, 20, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 216, 107, 0.65), transparent 35%),
        radial-gradient(circle at bottom right, rgba(100, 199, 255, 0.55), transparent 40%),
        linear-gradient(135deg, #fff5d8, #ffe6ef 45%, #e5f7ff);
      color: var(--texto);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: var(--sombra);
      border: 2px solid rgba(255, 255, 255, 0.75);
    }

    .badge {
      width: fit-content;
      margin: 0 auto 14px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 216, 107, 0.45);
      color: #735000;
      font-weight: 900;
      font-size: 0.8rem;
    }

    h1 {
      text-align: center;
      color: #3b2550;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #6b5873;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 900;
      color: #7a687f;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 2px solid rgba(100, 199, 255, 0.38);
      border-radius: 16px;
      padding: 0 14px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 14px;
      background: white;
      color: var(--texto);
    }

    input:focus {
      border-color: var(--laranja);
      box-shadow: 0 0 0 4px rgba(255, 159, 67, 0.18);
    }

    .button {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: 0.25s ease;
      margin-top: 10px;
    }

    .button:active {
      transform: scale(0.98);
    }

    .primary {
      color: white;
      background: linear-gradient(90deg, #ff8a3d, #ff5fa2, #8d74ff);
      box-shadow: 0 14px 24px rgba(255, 95, 162, 0.28);
    }

    .secondary {
      color: #493051;
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid rgba(255, 159, 67, 0.35);
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 126, 182, 0.2);
      color: #79334e;
      font-weight: 800;
      text-align: center;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Recuperação de acesso</div>

    <h1>Recuperar ingresso</h1>

    <p>
      Informe o email e o telefone usados no cadastro para recuperar o ingresso gerado.
    </p>

    <form id="recoverForm">
      <label for="email">Email usado no cadastro</label>
      <input type="email" id="email" placeholder="exemplo@email.com" required />

      <label for="phone">Telefone usado no cadastro</label>
      <input type="tel" id="phone" placeholder="(77) 99999-9999" required />

      <label for="birthDate">Data de nascimento usada no cadastro</label>
      <input type="date" id="birthDate" required />

      <button class="button primary" type="submit">Recuperar ingresso</button>
    </form>

    <button class="button secondary" type="button" id="backButton">
      Voltar para cadastro
    </button>

    <div class="message" id="message"></div>
  </main>

  <script>
    const API_URL = "https://sao-joao-ingressos.onrender.com";

    const form = document.getElementById("recoverForm");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const birthDateInput = document.getElementById("birthDate");
    const message = document.getElementById("message");
    const backButton = document.getElementById("backButton");

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("show");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "Buscando ingresso...";

      message.classList.remove("show");
      message.textContent = "";

      try {
        const response = await fetch(`${API_URL}/api/recuperar/ingresso`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
  email: emailInput.value.trim(),
  phone: phoneInput.value.trim(),
  birthDate: birthDateInput.value
})
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Não foi possível recuperar o ingresso.");
        }

        const buyerData = {
          compradorId: data.compradorId,
          fullName: data.comprador.fullName,
          birthDate: data.comprador.birthDate,
          phone: data.comprador.phone,
          email: data.comprador.email
        };

        const purchaseData = {
          pedidoId: data.pedido.pedidoId,
          ingressoId: data.ingresso.ingressoId,
          codigoValidacao: data.ingresso.codigoValidacao || data.pedido.codigoValidacao,
          compradorId: data.compradorId,
          quantity: data.pedido.quantidade,
          unitPrice: data.pedido.valorUnitario,
          totalPrice: data.pedido.valorTotal,
          status: data.pedido.status,
          statusPagamento: data.pedido.statusPagamento,
          loteId: data.pedido.loteId,
          loteNome: data.pedido.loteNome,
          recoveredAt: new Date().toISOString()
        };

        localStorage.setItem("saoJoaoBuyer", JSON.stringify(buyerData));
        localStorage.setItem("saoJoaoPurchase", JSON.stringify(purchaseData));

        window.location.href = "ingresso.html";
      } catch (error) {
        showMessage(error.message);

        button.disabled = false;
        button.textContent = "Recuperar ingresso";
      }
    });

    backButton.addEventListener("click", () => {
      window.location.href = "cadastro.html";
    });
  </script>
</body>
</html>
